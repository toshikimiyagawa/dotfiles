onboarding = false

[theme]
name = "gruvbox-light"
auto_switch = false

[keys]
prefix = "ctrl+s"

# Option 系ショートカット（Ghostty の macos-option-as-alt = true が前提）
# 上の段で前、下の段で次へ移動する
# エージェント切替: Option+q で前、Option+a で次
previous_agent = "alt+q"
next_agent = "alt+a"
# ペイン切替: Option+w で前、Option+s で次
cycle_pane_previous = "alt+w"
cycle_pane_next = "alt+s"
# タブ切替: Option+e / Option+← で前、Option+d / Option+→ で次
previous_tab = ["alt+e", "alt+left"]
next_tab = ["alt+d", "alt+right"]
# ワークスペース切替: Option+r で前、Option+f で次
previous_workspace = "alt+r"
next_workspace = "alt+f"
# 作成: Option+z でタブ、Option+x で左右分割、Option+c で上下分割、Option+v でワークスペース
new_tab = "alt+z"
split_vertical = "alt+x"
split_horizontal = "alt+c"
new_workspace = "alt+v"

# acn-devcontainer の Claude を新しいタブで開く（Option+b）。リポジトリは fzf で選ぶ。
# Esc で抜けたときや Claude が終わるとタブも閉じる。中身は bin/acn-claude-tab → bin/acn-claude
# （~/.ssh/config に Host acn-local が要る）。
[[keys.command]]
key = "alt+b"
type = "shell"
command = "$HOME/.config/herdr/bin/acn-claude-tab"

# 状態の印を形でも見分ける（working ◐・blocked ×・done ✓・idle ○・unknown ·）。
# gruvbox-light は状態の色が暗く、丸だけだと working・blocked・done が同じ黒っぽい丸に見えるため
[ui]
status_indicators = "symbols"

# エージェント一覧: 1 行目に状態と「h <フォルダ名>」（h はホスト、c はコンテナ）、2 行目に会話のタイトル。
# h は灰色（working の黄と重ならないように）、c は青
# $loc は .zshrc（ホスト）と bin/acn-claude（コンテナ）が herdr pane report-metadata で送る
# 状態の印のすぐ右の $bg（⧗）は、入力待ちでも裏でシェルやサブエージェントが動いている Claude の印。
# bin/herdr-bg-watch が送る。無いときは何も出ない
[ui.sidebar.agents]
rows = [
  ["state_icon", "$bg", { token = "$loc", rules = [{ starts_with = "c ", fg = "#076678" }, { starts_with = "h ", fg = "#7c6f64" }] }],
  ["terminal_title_stripped"],
]
