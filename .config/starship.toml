"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](color_gray)\
$os\
[](bg:color_blue fg:color_gray)\
$directory\
[](fg:color_blue bg:color_bg1)\
$git_branch\
$git_status\
[](fg:color_bg1 bg:color_bg2)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:color_bg2 bg:color_bg3)\
$time\
[ ](fg:color_bg3)\
$line_break$character"""

palette = 'tokyo_night'

[palettes.tokyo_night]
color_fg0 = '#e3e5e5'
color_fg1 = '#a0a9cb'
color_fg_dark = '#090c0c'
color_gray = '#a3aed2'
color_blue = '#769ff0'
color_bg1 = '#394260'
color_bg2 = '#212736'
color_bg3 = '#1d2230'
color_green = '#9ece6a'
color_red = '#f7768e'
color_purple = '#bb9af7'
color_yellow = '#e0af68'

[os]
disabled = false
style = "bg:color_gray fg:color_fg_dark"
format = '[ $symbol ]($style)'

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[directory]
style = "fg:color_fg0 bg:color_blue"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol $branch ](fg:color_blue bg:color_bg1)]($style)'

[git_status]
style = "bg:color_bg1"
format = '[[($all_status$ahead_behind )](fg:color_blue bg:color_bg1)]($style)'

[nodejs]
symbol = ""
style = "bg:color_bg2"
format = '[[ $symbol ($version) ](fg:color_blue bg:color_bg2)]($style)'

[bun]
symbol = ""
style = "bg:color_bg2"
format = '[[ $symbol ($version) ](fg:color_blue bg:color_bg2)]($style)'

[rust]
symbol = ""
style = "bg:color_bg2"
format = '[[ $symbol ($version) ](fg:color_blue bg:color_bg2)]($style)'

[golang]
symbol = ""
style = "bg:color_bg2"
format = '[[ $symbol ($version) ](fg:color_blue bg:color_bg2)]($style)'

[php]
symbol = ""
style = "bg:color_bg2"
format = '[[ $symbol ($version) ](fg:color_blue bg:color_bg2)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:color_bg3"
format = '[[  $time ](fg:color_fg1 bg:color_bg3)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:color_green)'
error_symbol = '[❯](bold fg:color_red)'
vimcmd_symbol = '[❮](bold fg:color_green)'
vimcmd_replace_one_symbol = '[❮](bold fg:color_purple)'
vimcmd_replace_symbol = '[❮](bold fg:color_purple)'
vimcmd_visual_symbol = '[❮](bold fg:color_yellow)'
