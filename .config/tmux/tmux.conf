# ホスト Mac の tmux 設定
# acn-devcontainer の .devcontainer/home/.tmux.conf に揃えたもの（違いは既定シェルのパスだけ）。

# ペイン操作を vim 風に
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ペインリサイズ
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# マウス有効
set -g mouse on

# ペイン境界線を見やすく
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour75

# 色。starship の powerline 表示が崩れないように true color を通す
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Claude Code は $TMUX があると自分で 256 色に落とす（オレンジがピンクに丸まる）。
# 上で truecolor を通しているので、落とさないよう指示する（tmux の中のシェルにだけ効く）。
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# extended-keys は使わない。有効にすると Ghostty の Cmd+キーが Meta として届き、下の Option の
# ショートカット (M-c/M-x/M-s など) に化ける。Claude Code の Shift+Enter の改行は無しでも使える。

# 既定シェル
set -g default-shell /bin/zsh

set -g history-limit 10000
set -g base-index 0

# ウィンドウ切替: Meta+Left / Meta+Right
bind -n M-Left  previous-window
bind -n M-Right next-window

# Option 系のショートカット。端末側で Option を Meta として送る設定が必要
# （Ghostty なら macos-option-as-alt = true）。
# ウィンドウ切替: Option+a / Option+d
bind -n M-a previous-window
bind -n M-d next-window
# ペイン切替: Option+s で次、Option+w で前
bind -n M-s select-pane -t :.+
bind -n M-w select-pane -t :.-
# 作成: Option+z でウィンドウ、Option+x で縦分割（左右）、Option+c で横分割（上下）
bind -n M-z new-window
bind -n M-x split-window -h
bind -n M-c split-window -v

# コピーをホストのクリップボードへ送る（OSC 52）。
# Ghostty / iTerm2 / Windows Terminal / VS Code はいずれも対応している。
set -g set-clipboard on
set -ga terminal-features ',*:clipboard'

# 補足: mouse on のときドラッグ選択は tmux が横取りする。
# 端末側のネイティブ選択を使いたいときは macOS なら Option を押しながらドラッグする。
