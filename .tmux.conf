set-option -g default-terminal screen-256color

set -sg escape-time 0
set-option -g prefix C-]
bind-key C-] send-prefix
set-option -g history-limit 20000

#set -g status off

# Option
set-window-option -g window-status-format '#I'
set-window-option -g window-status-current-format  "#[fg=cyan,bg=colour234] #I "
set-window-option -g mode-keys emacs
unbind C-b
unbind up
unbind down
unbind left
unbind right
unbind C-up
unbind C-down
unbind C-left
unbind C-right
unbind C-M-up
unbind C-M-down
unbind C-M-left
unbind C-M-right
unbind C-o

bind C-k kill-server
bind -r o select-pane -t :.+
bind S split-window -v
bind | split-window -h
#bind -n M-up    resize-pane -U 5
#bind -n M-down  resize-pane -D 5
#bind -n M-left  resize-pane -L 5
#bind -n M-right resize-pane -R 5
bind -n C-M-S-down select-pane -t :.+
bind -n C-M-S-up select-pane -t :.-
bind -n C-M-S-right next-window
bind -n C-M-S-left previous-window
bind C-] new-window -t 255 "tmux lsw | sed '/^255:/d' | percol | cut -d':' -f 1 | xargs tmux select-window -t; tmux kill-window -t 255" 
bind-key > save-buffer ~/tmp/tmux-buffer \; run-shell 'xsel -i -b < ~/tmp/tmux-buffer' \; display-message "copy to clipboard !"
bind-key < if-shell 'xsel -o -b > ~/tmp/tmux-buffer' 'load-buffer ~/tmp/tmux-buffer ; paste-buffer'
bind-key b new-window -t 255 "tmux lsw | sed '/^255:/d' | percol | cut -d':' -f 1 | xargs tmux select-window -t; tmux kill-window -t 255"
bind up source-file ~/.tmux.conf
